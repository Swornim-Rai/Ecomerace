<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products - EcoHub</title>
    <link rel="stylesheet" href="product.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>EcoHub</h1>
        </div>

        <div class="links">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html" class="active">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

            <input type="text" placeholder="Search Products...">
        </div>
    </header>

    <section class="hero">

        <div class="product-container">

            <aside class="filter">

                <h2>Filters</h2>

                <div class="filter-group">
                    <h3>Category</h3>

                    <label><input type="checkbox"> Electronics</label>
                    <label><input type="checkbox"> Fashion</label>
                    <label><input type="checkbox"> Home</label>
                    <label><input type="checkbox"> Accessories</label>
                </div>

                <div class="filter-group">
                    <h3>Price</h3>

                    <label><input type="radio" name="price"> Under $50</label>
                    <label><input type="radio" name="price"> $50 - $100</label>
                    <label><input type="radio" name="price"> $100 - $500</label>
                    <label><input type="radio" name="price"> Above $500</label>
                </div>

                <div class="filter-group">
                    <h3>Rating</h3>

                    <label><input type="checkbox"> ⭐⭐⭐⭐⭐</label>
                    <label><input type="checkbox"> ⭐⭐⭐⭐ & Up</label>
                    <label><input type="checkbox"> ⭐⭐⭐ & Up</label>
                </div>

                <button class="filter-btn">Apply Filters</button>

            </aside>

            <div class="products">

                

            </div>

        </div>

    </section>

</body>
</html>
